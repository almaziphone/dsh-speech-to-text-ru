<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Russian speech recognition">
  <defs>
    <linearGradient id="ruSpeech" x1="3" y1="5" x2="21" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67C7FE" />
      <stop offset="1" stop-color="#3F77D8" />
    </linearGradient>
  </defs>
  <!-- waveform bars -->
  <rect x="2" y="10" width="1.5" height="4" rx="0.75" fill="url(#ruSpeech)" />
  <rect x="5" y="8" width="1.5" height="8" rx="0.75" fill="url(#ruSpeech)" />
  <rect x="8" y="6" width="1.5" height="12" rx="0.75" fill="url(#ruSpeech)" />
  <!-- microphone -->
  <rect x="12.5" y="4.5" width="5" height="9" rx="2.5" fill="url(#ruSpeech)" />
  <path d="M10.8 11.5a4.2 4.2 0 0 0 8.4 0" stroke="url(#ruSpeech)" stroke-width="1.5" stroke-linecap="round" />
  <rect x="14.25" y="15.4" width="1.5" height="2.3" rx="0.75" fill="url(#ruSpeech)" />
  <!-- RU cue -->
  <text x="19.4" y="21.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="5" font-weight="800" fill="url(#ruSpeech)">RU</text>
</svg>
